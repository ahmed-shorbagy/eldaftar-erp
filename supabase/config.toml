project_id = "eldafttar-local"

[db]
port = 54322

[auth]
enable_signup = false
enable_anonymous_sign_ins = false
# Exact recovery callback. Do not add a wildcard. Hosted projects must
# allow this same URL; this file is not a remote configuration push.
additional_redirect_urls = ["eldafttar://auth/recovery"]

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
# This enables phone/password authentication; global signup remains disabled.
# No SMS delivery credentials are configured. Confirmation is disabled.
# CLI 2.118.0 incorrectly maps this boolean to sms_autoconfirm without inversion.
# For that CLI, set remote sms_autoconfirm=true through the Management API;
# do not push this file's phone confirmation field with that version.
enable_signup = true
enable_confirmations = false

[functions.owner-register]
# Registration precedes a user session; the handler validates the public API key.
verify_jwt = false

[functions.closing-staff-create]
# The handler verifies the bearer with Auth and uses that bearer for owner RPCs.
# This supports publishable-key deployments without trusting client role claims.
verify_jwt = false

[functions.r2-media]
# Presigned-URL broker for Cloudflare R2. The handler verifies the bearer and
# resolves the owner's shop through RLS before signing a short-lived URL. R2
# credentials come from function secrets (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET; optional R2_ENDPOINT_HOST, R2_REGION) and
# never leave the function. No service-role key reaches any client.
verify_jwt = false
